<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin maximum-scale: bloquear el zoom rompe la accesibilidad, y un número
         de serie medio borrado se lee acercándose. viewport-fit=cover para que
         el contenido llegue al borde en los móviles con muesca. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Parque de máquinas, visitas de mantenimiento y registro fotográfico." />
    <!-- Un número de serie o un drag factor de 199 no son números de teléfono. -->
    <meta name="format-detection" content="telephone=no" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1614" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ergobox" />

    <title>Ergobox</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
